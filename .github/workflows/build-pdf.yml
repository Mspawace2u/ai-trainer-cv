name: Build verified two-page PDFs

on:
  push:
    branches: [main]
    paths:
      - index.html
      - scripts/build_pdf.py
      - .github/workflows/build-pdf.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  print-cv:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Browser and PDF tooling
        run: |
          python -m pip install playwright pymupdf
          python -m playwright install --with-deps chromium
      - name: Generate and verify light/dark PDF
        run: python scripts/build_pdf.py
      - name: Commit updated PDFs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cv5-light.pdf cv5-dark.pdf
          if ! git diff --cached --quiet; then
            git commit -m "Publish verified two-page CV5 PDFs [skip ci]"
            git push
          fi
